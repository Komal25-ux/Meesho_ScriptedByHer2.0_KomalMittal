  <g><rect x="960" y="110.0" width="200" height="40" rx="10" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".35"><animate attributeName="fill" values="#2B0F28;#9F2089;#2B0F28;#2B0F28" keyTimes="0;.03;.14;1" dur="8.6s" begin="7.84s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.03;.14;1" dur="8.6s" begin="7.84s" repeatCount="indefinite"/></rect><text class="fl-mono" x="974" y="134.5" font-size="12" fill="#FCF2F9">assemble_reply</text></g><g><rect x="960" y="190.0" width="200" height="40" rx="10" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".35"><animate attributeName="fill" values="#2B0F28;#9F2089;#2B0F28;#2B0F28" keyTimes="0;.03;.14;1" dur="8.6s" begin="8.12s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.03;.14;1" dur="8.6s" begin="8.12s" repeatCount="indefinite"/></rect><text class="fl-mono" x="974" y="214.5" font-size="12" fill="#FCF2F9">Bulbul v3 TTS</text><text class="fl-mono" x="1148" y="214" font-size="10" text-anchor="end" fill="#C2A9BC">priya</text></g><g><rect x="960" y="270.0" width="200" height="40" rx="10" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".35"><animate attributeName="fill" values="#2B0F28;#9F2089;#2B0F28;#2B0F28" keyTimes="0;.03;.14;1" dur="8.6s" begin="8.41s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.03;.14;1" dur="8.6s" begin="8.41s" repeatCount="indefinite"/></rect><text class="fl-mono" x="974" y="294.5" font-size="12" fill="#FCF2F9">Voice reply</text><text class="fl-mono" x="1148" y="294" font-size="10" text-anchor="end" fill="#C2A9BC">HI</text></g>
  <g class="fl-mono" font-size="10.5" fill="#C2A9BC">
    <text x="40" y="410">“मुझे पीली साड़ी दिखाओ”</text>
