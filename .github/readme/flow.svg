<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="fl-t fl-d">
  <title id="fl-t">How one message flows through Sakhi</title>
  <desc id="fl-d">A Hindi voice note is transcoded by ffmpeg and transcribed by Sarvam Saarika v2.5. The LangGraph orchestrator loads memory, passes three human-in-the-loop gates and a context lock, then classifies intent with Gemini structured output and routes to the Catalog, Customer or Growth agent, the Returns funnel or the general handler. The reply is assembled, spoken by Sarvam Bulbul v3 and every step streams to the Orchestrator's Brain over a WebSocket.</desc>
  <defs>
    <linearGradient id="fl-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B0A19"/><stop offset="1" stop-color="#11050F"/></linearGradient>
    <radialGradient id="fl-glow" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#9F2089" stop-opacity=".45"/><stop offset="1" stop-color="#4A1445" stop-opacity="0"/></radialGradient>
    <filter id="fl-glowf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .fl-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .fl-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .fl-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .fl-draw { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: fl-draw 3s cubic-bezier(.65,0,.35,1) .2s forwards; }
    @keyframes fl-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .fl-draw { animation: none; stroke-dashoffset: 0; } .fl-pulse { display: none; } }
  </style>
  <rect width="1200" height="560" rx="20" fill="url(#fl-bg)"/>
  <rect width="1200" height="560" rx="20" fill="url(#fl-glow)"/>
  <rect x=".5" y=".5" width="1199" height="559" rx="19.5" fill="none" stroke="#E27BD0" stroke-opacity=".2"/>
  <rect x="10" y="10" width="1180" height="540" rx="13" fill="none" stroke="#F43397" stroke-opacity=".22" stroke-dasharray="5 6"/>
  <text class="fl-mono" x="40" y="70" font-size="11" letter-spacing="2.4" fill="#FFBE76">01 · HEAR</text><text class="fl-sans" x="40" y="90" font-size="12.5" fill="#C2A9BC">Hindi voice in</text>
  <text class="fl-mono" x="290" y="70" font-size="11" letter-spacing="2.4" fill="#FFBE76">02 · THINK</text><text class="fl-sans" x="290" y="90" font-size="12.5" fill="#C2A9BC">LangGraph state machine</text>
  <text class="fl-mono" x="710" y="70" font-size="11" letter-spacing="2.4" fill="#FFBE76">03 · ACT</text><text class="fl-sans" x="710" y="90" font-size="12.5" fill="#C2A9BC">route_decision</text>
  <text class="fl-mono" x="960" y="70" font-size="11" letter-spacing="2.4" fill="#FFBE76">04 · SPEAK</text><text class="fl-sans" x="960" y="90" font-size="12.5" fill="#C2A9BC">Hindi voice out</text>
  <rect x="276" y="98" width="408" height="340" rx="16" fill="none" stroke="#E27BD0" stroke-opacity=".25"/>
  <path class="fl-draw" d="M26 130 V350 H262 V130 H282 V410 H690 V130 H940 V290" fill="none" stroke="#E27BD0" stroke-opacity=".45" stroke-width="1.4"/>
  <g><rect x="40" y="110.0" width="200" height="40" rx="10" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".35"><animate attributeName="fill" values="#2B0F28;#9F2089;#2B0F28;#2B0F28" keyTimes="0;.03;.14;1" dur="8.6s" begin="1.00s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.03;.14;1" dur="8.6s" begin="1.00s" repeatCount="indefinite"/></rect><text class="fl-mono" x="54" y="134.5" font-size="12" fill="#FCF2F9">Voice note</text><text class="fl-mono" x="228" y="134" font-size="10" text-anchor="end" fill="#C2A9BC">WebM</text></g><g><rect x="40" y="190.0" width="200" height="40" rx="10" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".35"><animate attributeName="fill" values="#2B0F28;#9F2089;#2B0F28;#2B0F28" keyTimes="0;.03;.14;1" dur="8.6s" begin="1.57s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.03;.14;1" dur="8.6s" begin="1.57s" repeatCount="indefinite"/></rect><text class="fl-mono" x="54" y="214.5" font-size="12" fill="#FCF2F9">ffmpeg</text><text class="fl-mono" x="228" y="214" font-size="10" text-anchor="end" fill="#C2A9BC">→ WAV</text></g><g><rect x="40" y="270.0" width="200" height="40" rx="10" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".35"><animate attributeName="fill" values="#2B0F28;#9F2089;#2B0F28;#2B0F28" keyTimes="0;.03;.14;1" dur="8.6s" begin="2.14s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.03;.14;1" dur="8.6s" begin="2.14s" repeatCount="indefinite"/></rect><text class="fl-mono" x="54" y="294.5" font-size="12" fill="#FCF2F9">Saarika v2.5</text><text class="fl-mono" x="228" y="294" font-size="10" text-anchor="end" fill="#C2A9BC">ASR</text></g>
  <g><rect x="290" y="110.0" width="380" height="40" rx="10" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".35"><animate attributeName="fill" values="#2B0F28;#9F2089;#2B0F28;#2B0F28" keyTimes="0;.03;.14;1" dur="8.6s" begin="3.49s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.03;.14;1" dur="8.6s" begin="3.49s" repeatCount="indefinite"/></rect><text class="fl-mono" x="304" y="134.5" font-size="12" fill="#FCF2F9">load_memory</text></g><g><rect x="290" y="166.0" width="380" height="40" rx="10" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".35"><animate attributeName="fill" values="#2B0F28;#9F2089;#2B0F28;#2B0F28" keyTimes="0;.03;.14;1" dur="8.6s" begin="3.69s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.03;.14;1" dur="8.6s" begin="3.69s" repeatCount="indefinite"/></rect><text class="fl-mono" x="304" y="190.5" font-size="12" fill="#FCF2F9">check_pending_return</text><rect x="621.6" y="176" width="40" height="20" rx="10" fill="none" stroke="#FFBE76" stroke-opacity=".8"/><text class="fl-mono" x="642" y="190" font-size="9.5" letter-spacing=".8" text-anchor="middle" fill="#FFBE76">HITL</text></g><g><rect x="290" y="222.0" width="380" height="40" rx="10" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".35"><animate attributeName="fill" values="#2B0F28;#9F2089;#2B0F28;#2B0F28" keyTimes="0;.03;.14;1" dur="8.6s" begin="3.89s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.03;.14;1" dur="8.6s" begin="3.89s" repeatCount="indefinite"/></rect><text class="fl-mono" x="304" y="246.5" font-size="12" fill="#FCF2F9">check_pending_approval</text><rect x="621.6" y="232" width="40" height="20" rx="10" fill="none" stroke="#FFBE76" stroke-opacity=".8"/><text class="fl-mono" x="642" y="246" font-size="9.5" letter-spacing=".8" text-anchor="middle" fill="#FFBE76">HITL</text></g><g><rect x="290" y="278.0" width="380" height="40" rx="10" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".35"><animate attributeName="fill" values="#2B0F28;#9F2089;#2B0F28;#2B0F28" keyTimes="0;.03;.14;1" dur="8.6s" begin="4.09s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.03;.14;1" dur="8.6s" begin="4.09s" repeatCount="indefinite"/></rect><text class="fl-mono" x="304" y="302.5" font-size="12" fill="#FCF2F9">check_pending_selection</text><rect x="621.6" y="288" width="40" height="20" rx="10" fill="none" stroke="#FFBE76" stroke-opacity=".8"/><text class="fl-mono" x="642" y="302" font-size="9.5" letter-spacing=".8" text-anchor="middle" fill="#FFBE76">HITL</text></g><g><rect x="290" y="334.0" width="380" height="40" rx="10" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".35"><animate attributeName="fill" values="#2B0F28;#9F2089;#2B0F28;#2B0F28" keyTimes="0;.03;.14;1" dur="8.6s" begin="4.29s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.03;.14;1" dur="8.6s" begin="4.29s" repeatCount="indefinite"/></rect><text class="fl-mono" x="304" y="358.5" font-size="12" fill="#FCF2F9">check_fresh_context_lock</text><rect x="621.6" y="344" width="40" height="20" rx="10" fill="none" stroke="#42BC9E" stroke-opacity=".8"/><text class="fl-mono" x="642" y="358" font-size="9.5" letter-spacing=".8" text-anchor="middle" fill="#42BC9E">LOCK</text></g><g><rect x="290" y="390.0" width="380" height="40" rx="10" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".35"><animate attributeName="fill" values="#2B0F28;#9F2089;#2B0F28;#2B0F28" keyTimes="0;.03;.14;1" dur="8.6s" begin="4.49s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".35;1;.35;.35" keyTimes="0;.03;.14;1" dur="8.6s" begin="4.49s" repeatCount="indefinite"/></rect><text class="fl-mono" x="304" y="414.5" font-size="12" fill="#FCF2F9">detect_intent</text><rect x="608.4" y="400" width="54" height="20" rx="10" fill="none" stroke="#F7C9EE" stroke-opacity=".8"/><text class="fl-mono" x="635" y="414" font-size="9.5" letter-spacing=".8" text-anchor="middle" fill="#F7C9EE">GEMINI</text></g>
