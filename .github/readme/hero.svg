      <text class="hero-mono" x="72" y="452" font-size="10.5" letter-spacing="2" fill="#C2A9BC">VOICE-FIRST · VERNACULAR-FIRST · GROUNDED IN HER REAL CATALOG</text>
      <text class="hero-mono" x="1128" y="452" font-size="10.5" letter-spacing="2" text-anchor="end" fill="#F7C9EE">LIVE · MEESHO-SAKHI-KOMAL25.VERCEL.APP</text>
