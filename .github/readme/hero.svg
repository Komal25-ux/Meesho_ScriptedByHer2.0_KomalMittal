<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="hero-t hero-d">
  <title id="hero-t">Sakhi — the AI business didi for every Meesho reseller</title>
  <desc id="hero-d">Sakhi is a voice-first, Hindi-first agentic AI co-pilot. Four specialist agents (Catalog, Customer, Growth and Returns), routed by a LangGraph orchestrator, run a reseller's business. Meesho ScriptedBy Her 2.0, Top 50 of 36,000+.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B0A19"/><stop offset="1" stop-color="#11050F"/></linearGradient>
    <radialGradient id="hero-glow" cx="78%" cy="40%" r="70%"><stop offset="0" stop-color="#9F2089" stop-opacity=".7"/><stop offset="1" stop-color="#4A1445" stop-opacity="0"/></radialGradient>
    <filter id="hero-glowf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="hero-orb" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#D24BBE"/><stop offset=".6" stop-color="#9F2089"/><stop offset="1" stop-color="#5A1252"/></radialGradient>
    <radialGradient id="hero-mango" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FC8B16" stop-opacity=".22"/><stop offset="1" stop-color="#FC8B16" stop-opacity="0"/></radialGradient>
    <linearGradient id="hero-name" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="330" y2="0"><stop offset="0" stop-color="#FCF2F9"/><stop offset="1" stop-color="#F7C9EE"/></linearGradient>
    <linearGradient id="hero-sheen" gradientUnits="userSpaceOnUse" x1="-240" y1="0" x2="-40" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;640 0;640 0" keyTimes="0;.3;1" dur="9s" begin="2.5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="hero-dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#E27BD0" fill-opacity=".14"/></pattern>
    <radialGradient id="hero-fade" cx="75%" cy="45%" r="55%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="hero-mask"><rect width="1200" height="480" fill="url(#hero-fade)"/></mask>
    <clipPath id="hero-clip"><rect width="1200" height="480" rx="20"/></clipPath>
  </defs>
  <style>
    .hero-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .hero-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .hero-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .hero-rise { animation: hero-rise 1.3s cubic-bezier(.16,1,.3,1) both; }
    .hero-fade { animation: hero-fade 1.6s ease both; }
    .hero-ring { transform-origin: 0 0; animation: hero-ring 3.6s cubic-bezier(.2,.6,.3,1) infinite; }
    .hero-bar { transform-box: fill-box; transform-origin: center; animation: hero-bar 1s ease-in-out infinite alternate; }
    .hero-draw { stroke-dasharray: 700; stroke-dashoffset: 700; animation: hero-draw 2.2s cubic-bezier(.65,0,.35,1) 1s forwards; }
    @keyframes hero-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes hero-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes hero-ring { from { transform: scale(1); opacity: .9; } to { transform: scale(2.3); opacity: 0; } }
    @keyframes hero-bar { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
    @keyframes hero-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .hero-rise, .hero-fade, .hero-ring, .hero-bar { animation: none; } .hero-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g clip-path="url(#hero-clip)">
  <rect width="1200" height="480" rx="20" fill="url(#hero-bg)"/>
  <rect width="1200" height="480" rx="20" fill="url(#hero-glow)"/>
  <rect x=".5" y=".5" width="1199" height="479" rx="19.5" fill="none" stroke="#E27BD0" stroke-opacity=".2"/>
  <rect x="10" y="10" width="1180" height="460" rx="13" fill="none" stroke="#F43397" stroke-opacity=".22" stroke-dasharray="5 6"/>
    <rect width="1200" height="480" fill="url(#hero-dots)" mask="url(#hero-mask)"/>
    <ellipse cx="160" cy="470" rx="380" ry="200" fill="url(#hero-mango)"/>

    <!-- Copy -->
    <g class="hero-rise" style="animation-delay:.1s">
      <line x1="72" y1="78" x2="102" y2="78" stroke="#FC8B16"/>
      <text class="hero-mono" x="114" y="82" font-size="12" letter-spacing="3" fill="#FFBE76">MEESHO SCRIPTEDBY{HER} 2.0 · TOP 50 OF 36,000+</text>
    </g>
    <g class="hero-rise" style="animation-delay:.3s">
      <text class="hero-serif" x="66" y="190" font-size="112" font-weight="300" letter-spacing="-3" fill="url(#hero-name)">Sakhi</text>
      <text class="hero-serif" x="66" y="190" font-size="112" font-weight="300" letter-spacing="-3" fill="url(#hero-sheen)">Sakhi</text>
      <text class="hero-sans" x="378" y="186" font-size="46" font-weight="300" fill="#FC8B16">सखी</text>
    </g>
    <path class="hero-draw" d="M72 214 C 200 208, 380 220, 560 210" fill="none" stroke="#F43397" stroke-width="1.6" stroke-dasharray="6 6" stroke-opacity=".8"/>
    <g class="hero-rise" style="animation-delay:.55s">
      <text class="hero-serif" x="72" y="262" font-size="26" font-style="italic" fill="#FCF2F9">The AI business didi for every Meesho reseller.</text>
    </g>
    <g class="hero-rise" style="animation-delay:.8s">
      <text class="hero-sans" x="72" y="300" font-size="16" fill="#C2A9BC">She speaks in Hindi. Four agents list her products, answer her buyers,</text>
      <text class="hero-sans" x="72" y="324" font-size="16" fill="#C2A9BC">coach her growth and save her returns, all grounded in real data.</text>
    </g>
    <g class="hero-rise" style="animation-delay:1.30s"><rect x="72" y="356" width="87" height="28" rx="14" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".4"/><text class="hero-mono" x="115.5" y="374.5" font-size="11.5" text-anchor="middle" fill="#F7C9EE">LangGraph</text></g><g class="hero-rise" style="animation-delay:1.38s"><rect x="167" y="356" width="73" height="28" rx="14" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".4"/><text class="hero-mono" x="203.5" y="374.5" font-size="11.5" text-anchor="middle" fill="#F7C9EE">FastAPI</text></g><g class="hero-rise" style="animation-delay:1.46s"><rect x="248" y="356" width="66" height="28" rx="14" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".4"/><text class="hero-mono" x="281" y="374.5" font-size="11.5" text-anchor="middle" fill="#F7C9EE">Gemini</text></g><g class="hero-rise" style="animation-delay:1.54s"><rect x="322" y="356" width="136" height="28" rx="14" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".4"/><text class="hero-mono" x="390" y="374.5" font-size="11.5" text-anchor="middle" fill="#F7C9EE">Sarvam ASR · TTS</text></g><g class="hero-rise" style="animation-delay:1.62s"><rect x="466" y="356" width="80" height="28" rx="14" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".4"/><text class="hero-mono" x="506" y="374.5" font-size="11.5" text-anchor="middle" fill="#F7C9EE">pgvector</text></g>

