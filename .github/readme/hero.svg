          <animate attributeName="stroke-opacity" values=".45;1;.45;.45" keyTimes="0;.06;.2;1" dur="8s" begin="3.6s" repeatCount="indefinite"/>
          <animate attributeName="fill" values="#2B0F28;#4A1445;#2B0F28;#2B0F28" keyTimes="0;.06;.2;1" dur="8s" begin="3.6s" repeatCount="indefinite"/>
        </rect>
        <text class="hero-mono" x="51" y="21.5" font-size="11.5" text-anchor="middle" fill="#FCF2F9">Customer</text>
