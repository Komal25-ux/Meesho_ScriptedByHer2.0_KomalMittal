    <!-- Hindi voice bubble -->
    <g class="hero-rise" style="animation-delay:1.4s">
      <rect x="690" y="348" width="430" height="46" rx="16" fill="#FCF2F9" fill-opacity=".06" stroke="#F43397" stroke-opacity=".55" stroke-dasharray="5 4"/>
      <text class="hero-sans" x="712" y="377" font-size="16" fill="#FCF2F9">“मेरी नई साड़ी लिस्ट कर दो”</text>
      <text class="hero-mono" x="1100" y="376" font-size="10" letter-spacing="1.6" text-anchor="end" fill="#FFBE76">VOICE · HI</text>
