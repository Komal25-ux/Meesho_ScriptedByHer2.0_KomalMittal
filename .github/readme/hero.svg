          <animate attributeName="stroke-opacity" values=".45;1;.45;.45" keyTimes="0;.06;.2;1" dur="8s" begin="5.6s" repeatCount="indefinite"/>
          <animate attributeName="fill" values="#2B0F28;#4A1445;#2B0F28;#2B0F28" keyTimes="0;.06;.2;1" dur="8s" begin="5.6s" repeatCount="indefinite"/>
        </rect>
        <text class="hero-mono" x="42" y="21.5" font-size="11.5" text-anchor="middle" fill="#FCF2F9">Growth</text>
      </g><g transform="translate(689 283)">
        <rect width="93" height="34" rx="17" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".45">
          <animate attributeName="stroke-opacity" values=".45;1;.45;.45" keyTimes="0;.06;.2;1" dur="8s" begin="7.6s" repeatCount="indefinite"/>
          <animate attributeName="fill" values="#2B0F28;#4A1445;#2B0F28;#2B0F28" keyTimes="0;.06;.2;1" dur="8s" begin="7.6s" repeatCount="indefinite"/>
        </rect>
        <text class="hero-mono" x="46" y="21.5" font-size="11.5" text-anchor="middle" fill="#FCF2F9">Returns</text>
