      <circle r="3.5" fill="#FFBE76" filter="url(#hero-glowf)" opacity="0">
        <animateMotion path="M905 200 Q 795.0 116.0 745 92" dur="8s" begin="1.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.08;1" calcMode="linear"/>
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.02;.09;1" dur="8s" begin="1.0s" repeatCount="indefinite"/>
      </circle><circle r="3.5" fill="#FFBE76" filter="url(#hero-glowf)" opacity="0">
        <animateMotion path="M905 200 Q 1013.5 116.0 1062 92" dur="8s" begin="3.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.08;1" calcMode="linear"/>
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.02;.09;1" dur="8s" begin="3.0s" repeatCount="indefinite"/>
      </circle><circle r="3.5" fill="#FFBE76" filter="url(#hero-glowf)" opacity="0">
        <animateMotion path="M905 200 Q 1020.0 220.0 1075 300" dur="8s" begin="5.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.08;1" calcMode="linear"/>
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.02;.09;1" dur="8s" begin="5.0s" repeatCount="indefinite"/>
      </circle><circle r="3.5" fill="#FFBE76" filter="url(#hero-glowf)" opacity="0">
        <animateMotion path="M905 200 Q 790.0 220.0 735 300" dur="8s" begin="7.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.08;1" calcMode="linear"/>
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.02;.09;1" dur="8s" begin="7.0s" repeatCount="indefinite"/>
      </circle>
      <g transform="translate(905 200)">
        <circle class="hero-ring" style="animation-delay:0.0s" r="62" fill="none" stroke="#F7C9EE" stroke-opacity=".5"/><circle class="hero-ring" style="animation-delay:1.2s" r="62" fill="none" stroke="#F7C9EE" stroke-opacity=".5"/><circle class="hero-ring" style="animation-delay:2.4s" r="62" fill="none" stroke="#F7C9EE" stroke-opacity=".5"/>
        <circle r="62" fill="url(#hero-orb)" stroke="#F7C9EE" stroke-opacity=".6"/>
        <circle r="62" fill="none" stroke="#F43397" stroke-opacity=".7" stroke-dasharray="4 5" transform="scale(1.12)"/>
        <rect class="hero-bar" style="animation-delay:0.00s;animation-duration:0.60s" x="-28.0" y="-5.0" width="3" height="10" rx="1.5" fill="#FCF2F9"/><rect class="hero-bar" style="animation-delay:-0.11s;animation-duration:0.80s" x="-21.8" y="-9.0" width="3" height="18" rx="1.5" fill="#FCF2F9"/><rect class="hero-bar" style="animation-delay:-0.22s;animation-duration:1.00s" x="-15.6" y="-14.0" width="3" height="28" rx="1.5" fill="#FCF2F9"/><rect class="hero-bar" style="animation-delay:-0.33s;animation-duration:0.70s" x="-9.4" y="-8.0" width="3" height="16" rx="1.5" fill="#FCF2F9"/><rect class="hero-bar" style="animation-delay:-0.44s;animation-duration:0.90s" x="-3.2" y="-17.0" width="3" height="34" rx="1.5" fill="#FCF2F9"/><rect class="hero-bar" style="animation-delay:-0.55s;animation-duration:0.60s" x="3.0" y="-11.0" width="3" height="22" rx="1.5" fill="#FCF2F9"/><rect class="hero-bar" style="animation-delay:-0.66s;animation-duration:0.80s" x="9.2" y="-6.0" width="3" height="12" rx="1.5" fill="#FCF2F9"/><rect class="hero-bar" style="animation-delay:-0.77s;animation-duration:1.00s" x="15.4" y="-13.0" width="3" height="26" rx="1.5" fill="#FCF2F9"/><rect class="hero-bar" style="animation-delay:-0.88s;animation-duration:0.70s" x="21.6" y="-7.0" width="3" height="14" rx="1.5" fill="#FCF2F9"/><rect class="hero-bar" style="animation-delay:-0.99s;animation-duration:0.90s" x="27.8" y="-4.0" width="3" height="8" rx="1.5" fill="#FCF2F9"/>
      </g>
      <g transform="translate(699 75)">
        <rect width="93" height="34" rx="17" fill="#2B0F28" stroke="#E27BD0" stroke-opacity=".45">
          <animate attributeName="stroke-opacity" values=".45;1;.45;.45" keyTimes="0;.06;.2;1" dur="8s" begin="1.6s" repeatCount="indefinite"/>
          <animate attributeName="fill" values="#2B0F28;#4A1445;#2B0F28;#2B0F28" keyTimes="0;.06;.2;1" dur="8s" begin="1.6s" repeatCount="indefinite"/>
        </rect>
        <text class="hero-mono" x="46" y="21.5" font-size="11.5" text-anchor="middle" fill="#FCF2F9">Catalog</text>
