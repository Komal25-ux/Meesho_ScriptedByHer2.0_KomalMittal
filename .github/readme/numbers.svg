<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="nm-t nm-d">
  <title id="nm-t">Sakhi in numbers</title>
  <desc id="nm-d">12 LangGraph nodes in one compiled state machine; 3 human-in-the-loop gates (draft approval, product picker, returns); 5 Gemini models in a fallback chain with API key rotation; 100 catalog SKUs for RAG over Supabase pgvector; 560 pytest tests run in CI on every push to main.</desc>
  <defs>
    <linearGradient id="nm-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B0A19"/><stop offset="1" stop-color="#11050F"/></linearGradient>
    <radialGradient id="nm-glow" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#9F2089" stop-opacity=".45"/><stop offset="1" stop-color="#4A1445" stop-opacity="0"/></radialGradient>
    <filter id="nm-glowf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .nm-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .nm-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .nm-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .nm-in { animation: nm-in 1s cubic-bezier(.16,1,.3,1) both; }
    .nm-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: nm-draw 2.4s cubic-bezier(.65,0,.35,1) .3s forwards; }
    @keyframes nm-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes nm-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .nm-in { animation: none; } .nm-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <rect width="1200" height="250" rx="20" fill="url(#nm-bg)"/>
  <rect width="1200" height="250" rx="20" fill="url(#nm-glow)"/>
  <rect x=".5" y=".5" width="1199" height="249" rx="19.5" fill="none" stroke="#E27BD0" stroke-opacity=".2"/>
  <rect x="10" y="10" width="1180" height="230" rx="13" fill="none" stroke="#F43397" stroke-opacity=".22" stroke-dasharray="5 6"/>
  <path class="nm-draw" d="M40 66 H1160" stroke="#E27BD0" stroke-opacity=".35"/>
  <g class="nm-in" style="animation-delay:0.10s"><g transform="translate(64 66)">
    <circle r="4" fill="#FC8B16"/>
    <text class="nm-serif" y="76" font-size="56" font-weight="300" fill="#FCF2F9">12</text>
    <text class="nm-mono" y="110" font-size="11" letter-spacing="2" fill="#E27BD0">LANGGRAPH NODES</text>
    <text class="nm-sans" y="138" font-size="13" fill="#C2A9BC">one compiled state machine</text>
  </g></g>
  <g class="nm-in" style="animation-delay:0.22s"><g transform="translate(286 66)">
    <circle r="4" fill="#FC8B16"/>
    <text class="nm-serif" y="76" font-size="56" font-weight="300" fill="#FCF2F9">3</text>
    <text class="nm-mono" y="110" font-size="11" letter-spacing="2" fill="#E27BD0">HUMAN-IN-THE-LOOP GATES</text>
    <text class="nm-sans" y="138" font-size="13" fill="#C2A9BC">draft, picker, return</text>
  </g></g>
  <g class="nm-in" style="animation-delay:0.34s"><g transform="translate(508 66)">
    <circle r="4" fill="#FC8B16"/>
    <text class="nm-serif" y="76" font-size="56" font-weight="300" fill="#FCF2F9">5</text>
    <text class="nm-mono" y="110" font-size="11" letter-spacing="2" fill="#E27BD0">GEMINI MODELS</text>
    <text class="nm-sans" y="138" font-size="13" fill="#C2A9BC">fallback chain + key rotation</text>
  </g></g>
  <g class="nm-in" style="animation-delay:0.46s"><g transform="translate(730 66)">
    <circle r="4" fill="#FC8B16"/>
    <text class="nm-serif" y="76" font-size="56" font-weight="300" fill="#FCF2F9">100</text>
    <text class="nm-mono" y="110" font-size="11" letter-spacing="2" fill="#E27BD0">CATALOG SKUS</text>
    <text class="nm-sans" y="138" font-size="13" fill="#C2A9BC">RAG over Supabase pgvector</text>
  </g></g>
  <g class="nm-in" style="animation-delay:0.58s"><g transform="translate(952 66)">
    <circle r="4" fill="#FC8B16"/>
    <text class="nm-serif" y="76" font-size="56" font-weight="300" fill="#FCF2F9">560</text>
    <text class="nm-mono" y="110" font-size="11" letter-spacing="2" fill="#E27BD0">PYTEST TESTS</text>
    <text class="nm-sans" y="138" font-size="13" fill="#C2A9BC">on every push to main, in CI</text>
  </g></g>
</svg>
