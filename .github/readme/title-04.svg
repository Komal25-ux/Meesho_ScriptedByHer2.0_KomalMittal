  <rect width="1200" height="136" rx="20" fill="url(#t04-bg)"/>
  <rect width="1200" height="136" rx="20" fill="url(#t04-glow)"/>
  <rect x=".5" y=".5" width="1199" height="135" rx="19.5" fill="none" stroke="#E27BD0" stroke-opacity=".2"/>
  <rect x="10" y="10" width="1180" height="116" rx="13" fill="none" stroke="#F43397" stroke-opacity=".22" stroke-dasharray="5 6"/>
  <text class="t04-mono" x="56" y="46" font-size="12" letter-spacing="3" fill="#E27BD0"><tspan fill="#FFBE76">04</tspan>   GUARDRAILS</text>
  <text class="t04-mono" x="1144" y="46" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#C2A9BC">BUILT FOR TRUST</text>
  <text class="t04-serif" x="54" y="94" font-size="40" font-weight="300" letter-spacing="-1" fill="#FCF2F9">Grounded, gated, <tspan font-style="italic" fill="#F7C9EE">resilient.</tspan></text>
