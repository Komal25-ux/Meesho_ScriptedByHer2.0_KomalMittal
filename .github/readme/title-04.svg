<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 136" width="1200" height="136" role="img" aria-labelledby="t04-t">
  <title id="t04-t">04 Guardrails: Grounded, gated, resilient.</title>
  <defs>
    <linearGradient id="t04-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B0A19"/><stop offset="1" stop-color="#11050F"/></linearGradient>
    <radialGradient id="t04-glow" cx="10%" cy="0%" r="70%"><stop offset="0" stop-color="#9F2089" stop-opacity=".5"/><stop offset="1" stop-color="#4A1445" stop-opacity="0"/></radialGradient>
    <filter id="t04-glowf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="t04-line" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="1144" y2="0"><stop offset="0" stop-color="#FC8B16"/><stop offset=".45" stop-color="#9F2089"/><stop offset="1" stop-color="#9F2089" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .t04-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .t04-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .t04-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t04-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: t04-draw 1.8s cubic-bezier(.65,0,.35,1) .3s forwards; }
    @keyframes t04-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .t04-draw { animation: none; stroke-dashoffset: 0; } }
