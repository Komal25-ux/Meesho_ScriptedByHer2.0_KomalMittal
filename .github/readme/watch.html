<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sakhi · Launch film</title>
  <meta name="description" content="The Sakhi launch film: an agentic AI business didi for every Meesho reseller. Meesho ScriptedBy{Her} 2.0, Top 50 of 36,000+.">
  <meta property="og:title" content="Sakhi · Launch film">
  <meta property="og:image" content="poster.jpg">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #11050f; --surface: #1b0a19; --plum: #9f2089; --orchid: #e27bd0;
      --text: #fcf2f9; --muted: #c2a9bc; --mango: #fc8b16; --mango-l: #ffbe76; --thread: #f43397;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: radial-gradient(80% 60% at 70% 0%, #3b0f36 0%, var(--bg) 60%) fixed, var(--bg);
      color: var(--text); font-family: "Roboto Slab", Georgia, serif;
      display: grid; place-items: center; padding: 48px 16px;
    }
    main { width: min(1120px, 100%); }
    .eyebrow { font: 12px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .25em; color: var(--mango-l); text-transform: uppercase; margin: 0 0 14px; }
    h1 { font-weight: 300; font-size: clamp(36px, 6vw, 64px); letter-spacing: -.02em; margin: 0; }
    h1 span { color: var(--mango); font-family: system-ui, sans-serif; font-weight: 300; font-size: .7em; margin-left: .3em; }
    .lede { color: var(--muted); font-size: 18px; margin: 10px 0 28px; }
    .frame {
      position: relative; border-radius: 22px; padding: 10px;
      background: var(--surface); border: 1px solid rgba(226,123,208,.3);
      box-shadow: 0 30px 80px -30px rgba(159,32,137,.6);
    }
    .frame::after { content: ""; position: absolute; inset: 5px; border: 1px dashed rgba(244,51,151,.35); border-radius: 18px; pointer-events: none; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; background: #000; cursor: pointer; }
    .play {
      position: absolute; inset: 0; margin: auto; width: 92px; height: 92px; border-radius: 50%;
      border: 0; background: var(--mango); cursor: pointer; display: grid; place-items: center;
      transition: transform .3s cubic-bezier(.16,1,.3,1), opacity .3s;
    }
    .play::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--mango-l); animation: ring 2.4s cubic-bezier(.2,.6,.3,1) infinite; }
    .play svg { width: 34px; height: 34px; margin-left: 6px; }
    .play:hover { transform: scale(1.06); }
    .playing .play { opacity: 0; pointer-events: none; transform: scale(.9); }
    .hint {
      position: absolute; left: 26px; bottom: 24px; font: 12px "JetBrains Mono", ui-monospace, monospace;
      letter-spacing: .12em; padding: 8px 12px; border-radius: 999px; background: rgba(17,5,15,.75); color: var(--mango-l);
      border: 1px solid rgba(252,139,22,.4); opacity: 0; transition: opacity .3s; pointer-events: none;
    }
    .muted .hint { opacity: 1; }
    @keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
    .links a {
      font: 13px "JetBrains Mono", ui-monospace, monospace; letter-spacing: .08em; color: var(--text); text-decoration: none;
      padding: 12px 18px; border-radius: 999px; border: 1px solid rgba(226,123,208,.4); background: rgba(43,15,40,.6);
    }
    .links a.primary { background: var(--mango); border-color: var(--mango); color: var(--bg); }
    .links a:focus-visible, .play:focus-visible { outline: 2px solid var(--mango-l); outline-offset: 3px; }
    footer { margin-top: 36px; color: var(--muted); font-size: 14px; font-style: italic; }
    @media (prefers-reduced-motion: reduce) { .play::before { animation: none; opacity: 0; } .play, .hint { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Meesho ScriptedBy{Her} 2.0 · Top 50 of 36,000+</p>
    <h1>Sakhi<span>सखी</span></h1>
    <p class="lede">The AI business didi for every Meesho reseller. The launch film, 1:32.</p>

    <div class="frame" id="stage">
      <video id="film" src="sakhi-launch.mp4" poster="poster.jpg" preload="metadata" playsinline
             aria-label="Sakhi launch film, 1 minute 32 seconds"></video>
      <button class="play" id="play" aria-label="Play the launch film with sound">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4 20 12 6 20Z" fill="#11050f"/></svg>
      </button>
      <span class="hint" aria-hidden="true">PREVIEW · CLICK FOR SOUND</span>
    </div>

    <nav class="links">
      <a class="primary" href="https://meesho-sakhi-komal25.vercel.app/">Open the live demo</a>
      <a href="https://github.com/KomalMittal25/Sakhi">Back to the repository</a>
    </nav>
    <footer>Made by Komal Mittal for Bharat's 1.7 crore Meesho resellers.</footer>
  </main>

  <script>
    // Hover previews the film muted (browsers allow sound only after a click); a click plays it with sound.
    const film = document.getElementById("film");
    const stage = document.getElementById("stage");
    const play = document.getElementById("play");
    let chosen = false; // true once the viewer has clicked: hover no longer pauses it
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function withSound() {
      chosen = true;
      film.muted = false;
      film.controls = true;
      film.play();
    }
    play.addEventListener("click", withSound);
    film.addEventListener("click", () => { if (!film.controls) withSound(); });

    if (!reduced && matchMedia("(hover: hover)").matches) {
      stage.addEventListener("mouseenter", () => {
        if (chosen) return;
        film.muted = true;
        film.play().catch(() => {});
      });
      stage.addEventListener("mouseleave", () => { if (!chosen) film.pause(); });
    }
    film.addEventListener("play", () => stage.classList.add("playing"));
    film.addEventListener("pause", () => { if (!chosen) stage.classList.remove("playing", "muted"); });
    film.addEventListener("volumechange", () => stage.classList.toggle("muted", film.muted && !chosen));
    film.addEventListener("playing", () => stage.classList.toggle("muted", film.muted && !chosen));
    film.addEventListener("ended", () => { chosen = false; film.controls = false; stage.classList.remove("playing", "muted"); });
  </script>
</body>
</html>
