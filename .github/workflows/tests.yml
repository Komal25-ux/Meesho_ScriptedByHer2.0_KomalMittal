name: Sakhi Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: "https://mock.supabase.co"
      SUPABASE_SERVICE_KEY: "mock-service-key"
      GEMINI_API_KEY: "mock-gemini-key"
      GEMINI_API_KEY_FALLBACK: "mock-gemini-fallback"
      GEMINI_API_KEY_FALLBACK_2: "mock-gemini-fallback-2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run automated test suite
        env:
          HYPOTHESIS_PROFILE: ci   # fixed seed, so a property-test failure always reproduces
        run: pytest -q

      - name: Check the LLM evaluation is current (never calls Gemini)
        run: python scripts/run_llm_eval.py --check

      - name: Validate Python compilation
        run: python -m compileall backend scripts
