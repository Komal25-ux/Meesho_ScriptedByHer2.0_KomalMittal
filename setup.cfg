# Mutation testing (mutmut). Each "mutant" is a small deliberate bug - a <
# turned into <=, a 150 into 151, a branch removed - and the unit tests run
# against it; a test suite worth trusting fails for (kills) almost all of
# them. Only the deterministic rules are mutated: code whose behaviour
# depends on Gemini is exercised by components/, journeys/ and the LLM eval.
#   mutmut run && mutmut results
[mutmut]
source_paths = backend
only_mutate =
    backend/core/pricing.py
    backend/core/prompt_safety.py
    backend/core/routing/keywords.py
    backend/core/routing/llm_json.py
    backend/core/routing/triggers.py
    backend/core/metrics/sales.py
    backend/api/limits.py
    backend/api/timing.py
also_copy =
    scripts
    pytest.ini
pytest_add_cli_args_test_selection =
    backend/tests/unit
    backend/tests/api/test_limits.py
